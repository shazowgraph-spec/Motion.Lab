<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mlTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A45FF"/>
      <stop offset=".48" stop-color="#B44BFF"/>
      <stop offset="1" stop-color="#FF3D55"/>
    </linearGradient>
    <linearGradient id="mlOrb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#38D4FF"/>
      <stop offset="1" stop-color="#7B5AFF"/>
    </linearGradient>
    <linearGradient id="mlGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Tuile -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#mlTile)"/>
  <rect x="2" y="2" width="60" height="31" rx="18" fill="url(#mlGloss)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="17.25" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>

  <!-- Orbite + satellite -->
  <g transform="rotate(-26 32 32)">
    <ellipse cx="32" cy="32" rx="24.5" ry="10" fill="none" stroke="url(#mlOrb)" stroke-width="2.2" opacity=".85"/>
    <circle cx="56.5" cy="32" r="3.2" fill="#38D4FF"/>
    <circle cx="56.5" cy="32" r="5.4" fill="#38D4FF" opacity=".28"/>
  </g>

  <!-- Traînées de vitesse -->
  <g fill="#ffffff" opacity=".85">
    <rect x="14" y="23.5" width="7" height="3.6" rx="1.8" opacity=".95"/>
    <rect x="11" y="30.2" width="10" height="3.6" rx="1.8" opacity=".65"/>
    <rect x="14" y="36.9" width="7" height="3.6" rx="1.8" opacity=".4"/>
  </g>

  <!-- Play -->
  <path d="M28.5 21.8 L45.5 32 L28.5 42.2 Z" fill="#ffffff"/>
</svg>
